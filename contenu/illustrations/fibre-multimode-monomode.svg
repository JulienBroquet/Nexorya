<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760"><text x="380" y="24" class="tx b titre" text-anchor="middle" >Ce qui distingue les deux fibres : la taille du cœur</text><text x="40" y="56" class="tx b" text-anchor="start" >Multimode (OM3, OM4)</text><text x="250" y="56" class="tx3" text-anchor="start" >gaine turquoise ou violette · quelques centaines de mètres</text><rect x="40" y="70" width="500" height="70" rx="35" class="fond" /><rect x="40" y="83.0" width="500" height="44" rx="22.0" class="f2 pale" /><line x1="40" y1="83.0" x2="540" y2="83.0" class="ligne s2" /><line x1="40" y1="127.0" x2="540" y2="127.0" class="ligne s2" /><path d="M40,95 L90,115 L140,95 L190,115 L240,95 L290,115 L340,95 L390,115 L440,95 L490,115 L540,95" class="fleche" style="stroke:var(--led);stroke-width:2.2"/><path d="M40,111 L123,99 L206,111 L289,99 L372,111 L455,99 L538,111" class="fleche" style="stroke:var(--led);stroke-width:2.2"/><path d="M40,105 L540,105" class="fleche" style="stroke:var(--led);stroke-width:2.2"/><circle cx="640" cy="105" r="34" class="fond" stroke="var(--trait)"/><circle cx="640" cy="105" r="10.0" class="f2"/><text x="684" y="101" class="tx2 b" text-anchor="start" >cœur 50 µm</text><text x="684" y="119" class="tx3" text-anchor="start" >gaine 125 µm</text><text x="40" y="186" class="tx b" text-anchor="start" >Monomode (OS2)</text><text x="250" y="186" class="tx3" text-anchor="start" >gaine jaune · plusieurs kilomètres</text><rect x="40" y="200" width="500" height="70" rx="35" class="fond" /><rect x="40" y="230.0" width="500" height="10" rx="5.0" class="f3 pale" /><line x1="40" y1="230.0" x2="540" y2="230.0" class="ligne s3" /><line x1="40" y1="240.0" x2="540" y2="240.0" class="ligne s3" /><path d="M40,235 L540,235" class="fleche" style="stroke:var(--led);stroke-width:2.2"/><circle cx="640" cy="235" r="34" class="fond" stroke="var(--trait)"/><circle cx="640" cy="235" r="3" class="f3"/><text x="684" y="231" class="tx2 b" text-anchor="start" >cœur 9 µm</text><text x="684" y="249" class="tx3" text-anchor="start" >gaine 125 µm</text><text x="290" y="162" class="tx3" text-anchor="middle" >plusieurs trajets possibles : les rayons arrivent décalés, le signal s’étale</text><text x="290" y="292" class="tx3" text-anchor="middle" >un seul trajet : le signal reste net beaucoup plus loin</text></svg>
