<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760"><text x="380" y="24" class="tx b titre" text-anchor="middle" >Une trame Ethernet, dans l’ordre où elle passe sur le câble</text><rect x="40" y="50" width="92" height="64" rx="4" class="fond" /><text x="86.0" y="78" class="tx b" text-anchor="middle" style="font-size:13.5px">Préambule</text><text x="86.0" y="98" class="tx2" text-anchor="middle" >8 o</text><rect x="132" y="50" width="120" height="64" rx="4" class="f1 " /><text x="192.0" y="78" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">MAC destination</text><text x="192.0" y="98" class="tx2 blanc" text-anchor="middle" >6 o</text><rect x="252" y="50" width="110" height="64" rx="4" class="f1 " /><text x="307.0" y="78" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">MAC source</text><text x="307.0" y="98" class="tx2 blanc" text-anchor="middle" >6 o</text><rect x="362" y="50" width="60" height="64" rx="4" class="f2 " /><text x="392.0" y="78" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">Type</text><text x="392.0" y="98" class="tx2 blanc" text-anchor="middle" >2 o</text><rect x="422" y="50" width="240" height="64" rx="4" class="f0 pale" /><text x="542.0" y="78" class="tx b" text-anchor="middle" style="font-size:13.5px">Données</text><text x="542.0" y="98" class="tx2" text-anchor="middle" >46 à 1 500 octets</text><rect x="662" y="50" width="60" height="64" rx="4" class="f3 " /><text x="692.0" y="78" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">FCS</text><text x="692.0" y="98" class="tx2 blanc" text-anchor="middle" >4 o</text><text x="86" y="136" class="tx3" text-anchor="middle" >ajouté par</text><text x="86" y="150" class="tx3" text-anchor="middle" >la carte</text><path d="M132,122 q0,8 8,8 H271.0 q6,0 6,8 q0,-8 6,-8 H414 q8,0 8,-8" class="ligne" /><text x="277.0" y="152" class="tx2" text-anchor="middle" >en-tête : 14 octets</text><path d="M132,170 q0,8 8,8 H421.0 q6,0 6,8 q0