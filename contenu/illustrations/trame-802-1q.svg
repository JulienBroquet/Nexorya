<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760"><text x="380" y="24" class="tx b titre" text-anchor="middle" >Où se glisse l’étiquette 802.1Q</text><text x="40" y="58" class="tx2" text-anchor="start" >Sans étiquette (port d’accès)</text><rect x="60" y="66" width="100" height="44" rx="4" class="f1" /><text x="110.0" y="93" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">MAC dest.</text><rect x="160" y="66" width="100" height="44" rx="4" class="f1" /><text x="210.0" y="93" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">MAC source</text><rect x="260" y="66" width="60" height="44" rx="4" class="f2" /><text x="290.0" y="93" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">Type</text><rect x="320" y="66" width="200" height="44" rx="4" class="f0 pale" /><text x="420.0" y="93" class="tx b" text-anchor="middle" style="font-size:13.5px">Données</text><rect x="520" y="66" width="56" height="44" rx="4" class="f3" /><text x="548.0" y="93" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">FCS</text><text x="40" y="138" class="tx2" text-anchor="start" >Avec étiquette (lien trunk) : 4 octets de plus</text><rect x="60" y="146" width="100" height="44" rx="4" class="f1" /><text x="110.0" y="173" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">MAC dest.</text><rect x="160" y="146" width="100" height="44" rx="4" class="f1" /><text x="210.0" y="173" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">MAC source</text><rect x="260" y="146" width="80" height="44" rx="4" class="f4" /><text x="300.0" y="173" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">802.1Q</text><rect x="340" y="146" width="60" height="44" rx="4" class="f2" /><text x="370.0" y="173" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">Type</text><rect x="400" y="146" width="200" height="44" rx="4" class="f0 pale" /><text x="500.0" y="173" class="tx b" text-anchor="middle" style="font-size:13.5px">Données</text><rect x="600" y="146" width="56" height="44" rx="4" class="f3" /><text x="628.0" y="173" class="tx b blanc" text-anchor="middle" style="font-size:13.5px">FCS</text><path d="M260,190 L150,236" class="ligne" /><path d="M340,190 L670,236" class="ligne" /><rect x="150" y="236" width="220" height="52" rx="4" class="fond" /><text x="260.0" y="258" class="tx b mono" text-anchor="middle" style="font-size:13px">TPID = 0x8100</text><text x="260.0" y="276" class="tx3" text-anchor="middle" >16 bits : « étiquette VLAN »</text><rect x="370" y="236" width="90" height="52" rx="4" class="fond" /><text x="415.0" y="258" class="tx b mono" text-anchor="middle" style="font-size:13px">PCP</text><text x="415.0" y="276" class="tx3" text-anchor="middle" >3 bits : priorité</text><rect x="460" y="236" width="60" height="52" rx="4" class="fond" /><text x="490.0" y="258" class="tx b mono" text-anchor="middle" style="font-size:13px">DEI</text><text x="490.0" y="276" class="tx3" text-anchor="middle" >1 bit</text><rect x="520" y="236" width="150" height="52" rx="4" class="f4 pale" /><text x="595.0" y="258" class="tx b mono" text-anchor="middle" style="font-size:13px">VID</text><text x="595.0" y="276" class="tx3" text-anchor="middle" >12 bits : n° de VLAN</text></svg>
