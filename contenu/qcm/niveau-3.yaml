# QCM du niveau 3 — Services et applications. Format : voir CONTRIBUTING.md.
# La bonne réponse est écrite en premier ; le générateur mélange les propositions.
niveau: 3
titre: "Services et applications"
questions:

- niveau: "Découverte"
  situation: "Un utilisateur ouvre http://10.20.0.15 et l’ERP s’affiche. Avec http://erp.exemple.fr, la page ne se charge pas."
  question: "Quel service soupçonnes-tu en premier ?"
  bonne: ["Le DNS", "Le serveur et le réseau répondent par adresse IP : seule la traduction du nom en adresse échoue."]
  fausses:
    - ["Le câblage du poste", "Si le câble posait problème, l’accès par adresse IP échouerait aussi."]
    - ["Le Spanning Tree", "Une boucle ou un port bloqué toucherait tous les accès, pas seulement ceux par nom."]
    - ["Le serveur Web de l’ERP", "Il répond correctement quand on l’appelle par son adresse."]
  retenir: "Par IP oui, par nom non → DNS."
  fiche: "dns"

- niveau: "Découverte"
  situation: "Un nouvel étage est câblé. Les postes doivent recevoir automatiquement adresse, passerelle et DNS."
  question: "Quel service s’en charge ?"
  bonne: ["DHCP", "DHCP prête à chaque appareil une adresse et lui fournit la configuration réseau (passerelle, DNS, bail)."]
  fausses:
    - ["DNS", "Le DNS traduit des noms en adresses ; il n’attribue pas d’adresse aux postes."]
    - ["NTP", "NTP synchronise les horloges."]
    - ["ARP", "ARP trouve l’adresse MAC d’une IP déjà connue ; il ne configure rien."]
  retenir: "DHCP = adresse + masque + passerelle + DNS, automatiquement."
  fiche: "dhcp"

- niveau: "Découverte"
  situation: "Un poste Windows affiche l’adresse 169.254.31.7 et aucune passerelle."
  question: "Que s’est-il passé ?"
  bonne: ["Aucun serveur DHCP n’a répondu", "Une adresse en 169.254.x.x est attribuée par le poste lui-même quand il n’obtient pas de réponse DHCP."]
  fausses:
    - ["Le DNS est en panne", "Le DNS n’attribue pas d’adresse ; le poste aurait une adresse normale sans pouvoir résoudre les noms."]
    - ["Le poste a reçu une adresse publique", "169.254.x.x est une plage de lien local, pas une adresse publique."]
    - ["Le poste est en IPv6 uniquement", "Cette adresse est bien de l’IPv4, attribuée faute de DHCP."]
  retenir: "169.254.x.x = pas de réponse DHCP."
  fiche: "dhcp"

- niveau: "Découverte"
  situation: "La téléphonie de l’entreprise transporte la voix sur le réseau."
  question: "Pourquoi le flux audio utilise-t-il UDP plutôt que TCP ?"
  bonne: ["Une syllabe retransmise arriverait trop tard pour être utile", "En temps réel, mieux vaut perdre un petit morceau que retarder toute la conversation en attendant une retransmission."]
  fausses:
    - ["UDP chiffre la voix", "UDP ne chiffre rien ; le chiffrement de la voix se fait avec SRTP."]
    - ["UDP garantit l’ordre des paquets", "C’est TCP qui garantit l’ordre ; RTP ajoute des numéros pour que le téléphone remette les paquets dans l’ordre."]
    - ["TCP est interdit sur les réseaux d’entreprise", "TCP est partout : Web, e-mail, fichiers."]
  retenir: "Temps réel → UDP (+ RTP) : une donnée en retard est une donnée perdue."
  fiche: "udp"

- niveau: "Découverte"
  situation: "Un site interne affiche une erreur « 502 Bad Gateway »."
  question: "Que t’apprend ce code ?"
  bonne: ["Un reverse proxy a répondu, mais n’a pas obtenu de réponse valide du serveur applicatif derrière lui", "La connexion jusqu’au proxy fonctionne ; le problème se situe entre le proxy et le serveur applicatif, ou dans l’application."]
  fausses:
    - ["Le poste n’a pas d’accès réseau", "Sans réseau, aucun code HTTP n’aurait été reçu."]
    - ["Le mot de passe est incorrect", "Une authentification échouée donne plutôt 401 ou 403."]
    - ["La page n’existe pas", "Une page inexistante donne 404."]
  retenir: "4xx/5xx = un serveur HTTP a répondu ; 502/504 = problème derrière le proxy."
  fiche: "http"

- niveau: "Découverte"
  situation: "Des administrateurs se connectent encore aux switches avec Telnet."
  question: "Pourquoi faut-il passer à SSH ?"
  bonne: ["Telnet transmet tout en clair, y compris le mot de passe", "SSH chiffre la session et vérifie l’identité de l’équipement ; avec Telnet, une simple capture révèle les identifiants."]
  fausses:
    - ["Telnet est plus lent que SSH", "La vitesse n’est pas le problème : c’est l’absence de chiffrement."]
    - ["Telnet ne fonctionne qu’en IPv6", "Telnet fonctionne en IPv4 et en IPv6."]
    - ["SSH n’a pas besoin de mot de passe", "SSH peut utiliser des clés, mais l’argument principal est le chiffrement."]
  retenir: "Administration à distance → SSH, jamais Telnet."
  fiche: "ssh"

- niveau: "Découverte"
  situation: "Les journaux du pare-feu indiquent 14 h 02 et ceux du serveur 13 h 57 pour le même événement."
  question: "Quel service faut-il corriger ?"
  bonne: ["NTP", "Les horloges ne sont pas synchronisées : sans NTP, les journaux ne peuvent pas être corrélés, et les certificats ou Kerberos peuvent échouer."]
  fausses:
    - ["Syslog", "Syslog transporte les messages ; il n’a pas d’influence sur l’heure des équipements."]
    - ["SNMP", "SNMP supervise les équipements, il ne règle pas leur horloge."]
    - ["DHCP", "DHCP peut annoncer un serveur NTP, mais c’est NTP qui synchronise."]
  retenir: "Journaux corrélables, certificats valides, Kerberos fonctionnel → NTP."
  fiche: "ntp"

- niveau: "Découverte"
  situation: "Les utilisateurs d’une agence partagent une seule adresse IP publique pour aller sur Internet."
  question: "Quel mécanisme le permet ?"
  bonne: ["Le NAT avec ports (PAT)", "Le routeur remplace l’adresse privée de chaque connexion par son adresse publique et distingue les connexions par le numéro de port."]
  fausses:
    - ["Le DHCP", "DHCP distribue des adresses privées en interne, il ne les traduit pas."]
    - ["Le DNS", "Le DNS traduit des noms, pas des adresses."]
    - ["Le VLAN natif", "Le VLAN natif concerne les trunks Ethernet."]
  retenir: "Une adresse publique pour beaucoup de postes → PAT."
  fiche: "nat"

- niveau: "Découverte"
  situation: "Une application cherche les comptes et les groupes des utilisateurs dans Active Directory."
  question: "Quel protocole utilise-t-elle ?"
  bonne: ["LDAP", "LDAP est le protocole d’interrogation de l’annuaire : recherche d’un utilisateur, vérification du mot de passe, lecture des groupes."]
  fausses:
    - ["SMB", "SMB sert au partage de fichiers et d’imprimantes."]
    - ["SNMP", "SNMP supervise les équipements réseau."]
    - ["SIP", "SIP établit des appels téléphoniques."]
  retenir: "Annuaire, comptes, groupes → LDAP (et LDAPS pour chiffrer)."
  fiche: "ldap"

- niveau: "Pratique"
  situation: "Un poste envoie des SYN vers un serveur sur le port 443 et reçoit immédiatement un RST."
  question: "Que faut-il en conclure ?"
  bonne: ["Le serveur est joignable, mais aucun service n’écoute sur ce port (ou un équipement refuse explicitement)", "Le RST est une réponse : la machine existe et répond, mais refuse la connexion sur ce port."]
  fausses:
    - ["Le câble du serveur est débranché", "Un serveur débranché ne répondrait rien du tout."]
    - ["Le DNS renvoie une mauvaise adresse", "Le RST vient de l’adresse contactée ; il faudrait vérifier séparément que c’est la bonne, mais ce n’est pas ce que signifie le RST."]
    - ["La MTU est trop petite", "Un problème de MTU n’empêche pas la poignée de main, qui utilise de petits paquets."]
  retenir: "Pas de réponse = filtrage ou injoignable ; RST = joignable mais refusé."
  fiche: "tcp"

- niveau: "Pratique"
  situation: "Une capture montre de nombreux « TCP ZeroWindow » envoyés par un serveur de sauvegarde, et aucune retransmission."
  question: "Où se situe le problème ?"
  bonne: ["Dans le serveur de sauvegarde, qui ne lit pas les données assez vite", "La fenêtre nulle signifie que l’application réceptrice est saturée ; le réseau ne perd rien."]
  fausses:
    - ["Sur le réseau, qui perd des paquets", "Des pertes provoqueraient des retransmissions, absentes ici."]
    - ["Dans le DNS", "La connexion est établie : le DNS n’intervient plus."]
    - ["Dans le Spanning Tree", "Un problème de couche 2 ne se traduit pas par une fenêtre TCP nulle."]
  retenir: "ZeroWindow → récepteur saturé ; retransmissions → pertes réseau."
  fiche: "tcp"

- niveau: "Pratique"
  situation: "On doit changer l’adresse IP de www.exemple.fr vendredi soir. Le TTL de l’enregistrement est de 86 400 s."
  question: "Que faut-il faire au moins 24 heures avant ?"
  bonne: ["Baisser le TTL de l’enregistrement (par exemple à 300 s)", "Les résolveurs gardent la réponse pendant le TTL : en le baissant à l’avance, les caches expireront vite après le changement."]
  fausses:
    - ["Vider le cache DNS de tous les postes le soir même", "On ne maîtrise pas les caches des résolveurs extérieurs, ni tous les postes."]
    - ["Supprimer l’enregistrement A", "Le site deviendrait injoignable."]
    - ["Ajouter un enregistrement MX", "Le MX concerne la messagerie, pas le site Web."]
  retenir: "Migration DNS → baisser le TTL à l’avance."
  fiche: "dns"

- niveau: "Pratique"
  situation: "Certaines résolutions DNS échouent, toujours pour des noms avec beaucoup d’enregistrements. Le pare-feu n’autorise que l’UDP 53 vers les résolveurs."
  question: "Quelle est la cause probable ?"
  bonne: ["Les réponses trop grandes sont reprises en TCP 53, qui est bloqué", "Le serveur tronque la réponse en UDP ; le client recommence en TCP 53. Sans cette ouverture, seules les grosses réponses échouent."]
  fausses:
    - ["Le DNS ne fonctionne qu’en IPv6", "Le DNS fonctionne en IPv4 et en IPv6."]
    - ["Les noms longs sont interdits par la norme", "La norme autorise des noms jusqu’à 253 caractères."]
    - ["Le TTL est trop court", "Le TTL agit sur la mise en cache, pas sur la réussite d’une requête."]
  retenir: "Le DNS a besoin d’UDP **et** de TCP 53."
  fiche: "dns"

- niveau: "Pratique"
  situation: "Un nouveau VLAN est créé. Les postes obtiennent 169.254.x.x alors que le serveur DHCP central possède une étendue pour ce VLAN."
  question: "Que manque-t-il le plus souvent ?"
  bonne: ["Le relais DHCP (ip helper-address) sur la passerelle du VLAN", "Le Discover est un broadcast : sans relais, il ne quitte pas le VLAN et n’atteint pas le serveur central."]
  fausses:
    - ["Une route par défaut sur les postes", "Les postes n’ont pas encore d’adresse : le problème se situe avant."]
    - ["Un enregistrement DNS pour le serveur DHCP", "Le DHCP ne passe pas par le DNS."]
    - ["Le PoE sur les ports", "Les postes sont alimentés et envoient bien leurs demandes."]
  retenir: "Serveur DHCP dans un autre réseau → relais sur chaque VLAN."
  fiche: "dhcp"

- niveau: "Pratique"
  situation: "Un portail interne affiche « certificat expiré » sur un seul poste. Le certificat est valide jusqu’en 2027."
  question: "Que vérifies-tu en premier ?"
  bonne: ["L’heure et la date du poste", "Si l’horloge du poste est fausse, un certificat valide peut lui paraître expiré ou pas encore valide."]
  fausses:
    - ["Le câble du poste", "Le poste joint le portail, puisqu’il reçoit son certificat."]
    - ["La table ARP du routeur", "ARP n’a aucun rapport avec la validité d’un certificat."]
    - ["Le VLAN du serveur", "Le serveur répond : son VLAN est correct."]
  retenir: "TLS et horloge sont liés : un poste à la mauvaise date rejette des certificats valides."
  fiche: "tls"

- niveau: "Pratique"
  situation: "Après le renouvellement d’un certificat, les navigateurs fonctionnent, mais une application métier échoue avec « unable to get local issuer certificate »."
  question: "Quelle est la cause la plus probable ?"
  bonne: ["Le serveur n’envoie pas le certificat intermédiaire (chaîne incomplète)", "Les navigateurs complètent souvent la chaîne depuis leur cache ; l’application, non."]
  fausses:
    - ["Le certificat est au mauvais nom", "Les navigateurs afficheraient aussi une erreur de nom."]
    - ["TLS 1.3 n’est pas supporté par le serveur", "La négociation aboutit avec les navigateurs ; l’erreur concerne la vérification de la chaîne."]
    - ["Le port 443 est fermé", "La connexion TLS s’établit, puisque le certificat est reçu."]
  retenir: "Toujours installer la chaîne complète (certificat + intermédiaires)."
  fiche: "tls"

- niveau: "Pratique"
  situation: "Un appel SIP s’établit (le téléphone sonne, on décroche) mais personne n’entend rien."
  question: "Quel flux faut-il examiner ?"
  bonne: ["Les flux RTP annoncés dans le SDP, et les règles NAT/pare-feu qui les concernent", "La signalisation SIP fonctionne ; c’est le transport de la voix (RTP, sur d’autres ports) qui est bloqué ou mal adressé."]
  fausses:
    - ["Uniquement le TCP 22", "SSH n’a aucun rôle dans un appel."]
    - ["Le port SNMP 161", "La supervision n’influence pas le son d’un appel."]
    - ["L’enregistrement MX du domaine", "Le MX concerne la messagerie électronique."]
  retenir: "Appel établi sans son → RTP (ports, NAT, SDP)."
  fiche: "sip"

- niveau: "Pratique"
  situation: "Un transfert FTP fonctionne dans le réseau local, mais à travers le pare-feu la connexion s’ouvre et les téléchargements se figent."
  question: "Pourquoi ?"
  bonne: ["Le canal de données, ouvert sur un autre port, n’est pas autorisé", "FTP utilise une connexion de contrôle (21) et une connexion de données sur un port négocié ; seule la première passe."]
  fausses:
    - ["FTP n’utilise aucun port", "FTP utilise TCP 21 et des ports de données."]
    - ["FTP fonctionne en UDP 53", "UDP 53 est le DNS."]
    - ["ARP est désactivé", "ARP fonctionne localement et ne dépend pas du pare-feu."]
  retenir: "FTP = deux connexions ; préférer SFTP (un seul port, chiffré)."
  fiche: "ftp"

- niveau: "Pratique"
  situation: "Un serveur Web est derrière un load balancer qui vérifie seulement que le port 8080 est ouvert. L’application renvoie des erreurs 500, mais le serveur reste dans le groupe."
  question: "Que corriger ?"
  bonne: ["Utiliser une sonde HTTP qui teste une page de santé et attend un code 200", "Une sonde TCP ne vérifie que l’ouverture du port ; elle ne voit pas qu’une application est en échec."]
  fausses:
    - ["Activer la persistance des sessions", "La persistance garde un client sur un serveur ; elle ne détecte pas les pannes."]
    - ["Passer en répartition niveau 4", "C’est déjà ce que fait une sonde TCP : il faut au contraire tester l’application."]
    - ["Augmenter le TTL DNS du site", "Le DNS n’intervient pas dans la santé des serveurs du groupe."]
  retenir: "Sonde de santé = tester ce que l’utilisateur utilise vraiment."
  fiche: "proxy"

- niveau: "Pratique"
  situation: "On configure « logging trap warnings » sur un switch. Les messages « interface changed state to down » n’arrivent pas au serveur Syslog."
  question: "Pourquoi ?"
  bonne: ["Ces messages ont la gravité 5 (notification), au-dessus du seuil 4 configuré", "« warnings » n’envoie que les gravités 0 à 4. Il faut « notifications » ou « informational »."]
  fausses:
    - ["Syslog ne transporte pas les messages d’interface", "Les changements d’état d’interface font partie des messages Syslog les plus courants."]
    - ["Le serveur doit être en TCP", "Le transport n’explique pas l’absence d’un seul type de message."]
    - ["Il faut activer SNMP", "SNMP est un autre canal ; Syslog peut envoyer ces messages seul."]
  retenir: "Le niveau de logging trap fixe la gravité maximale envoyée."
  fiche: "syslog"

- niveau: "Pratique"
  situation: "Test-NetConnection srv-fichiers -Port 445 renvoie PingSucceeded False et TcpTestSucceeded True."
  question: "Le serveur est-il joignable pour le partage de fichiers ?"
  bonne: ["Oui, le port 445 répond ; seul l’ICMP est filtré", "La réussite du test TCP prouve la joignabilité du service. Le ping peut être bloqué volontairement."]
  fausses:
    - ["Non, le ping a échoué", "Un ping qui échoue ne prouve pas qu’un service est injoignable."]
    - ["Non, il faut aussi que l’UDP 445 réponde", "SMB utilise le TCP 445."]
    - ["On ne peut rien conclure sans traceroute", "Le test TCP suffit à prouver l’ouverture du port."]
  retenir: "Tester le port du service, pas seulement le ping."
  fiche: "diagnostic"

- niveau: "Expert"
  situation: "Après l’activation du DHCP Snooping, plus aucun poste n’obtient d’adresse alors que l’uplink est « trusted ». Le relais DHCP est un routeur Cisco."
  question: "Quelle est la cause probable ?"
  bonne: ["L’option 82 insérée par le switch est rejetée par le relais", "Par défaut, le switch ajoute l’option 82 ; le relais Cisco rejette ces requêtes si l’interface n’est pas déclarée de confiance pour cette option."]
  fausses:
    - ["Le serveur DHCP n’a plus d’adresses", "L’activation du snooping ne vide pas l’étendue."]
    - ["Le DHCP Snooping bloque les Discover", "Le snooping bloque les réponses venant de ports non fiables, pas les demandes des postes."]
    - ["Les postes doivent passer en IPv6", "Le problème concerne la relation entre le switch et le relais DHCPv4."]
  retenir: "Snooping + relais Cisco → penser à l’option 82."
  fiche: "dhcp"

- niveau: "Expert"
  situation: "Deux entreprises qui fusionnent utilisent toutes les deux 192.168.10.0/24 et doivent être reliées par VPN rapidement."
  question: "Quelle solution technique permet de les relier sans renuméroter tout de suite ?"
  bonne: ["Une double traduction NAT aux extrémités du tunnel, vers des plages neutres", "Chaque site voit l’autre derrière une plage différente ; les adresses identiques ne se rencontrent jamais."]
  fausses:
    - ["Un VLAN natif différent de chaque côté", "Le VLAN natif est une notion de couche 2 sans rapport avec un recouvrement d’adresses IP."]
    - ["Augmenter le TTL des paquets", "Le TTL n’a aucun lien avec les adresses."]
    - ["Activer DNSSEC", "DNSSEC authentifie les réponses DNS, il ne résout pas un conflit d’adresses."]
  retenir: "Recouvrement d’adresses → NAT des deux côtés, puis renumérotation."
  fiche: "nat"

- niveau: "Expert"
  situation: "Depuis la mise en place d’un reverse proxy devant une application, les administrateurs ne peuvent plus bloquer certains utilisateurs par leur adresse IP sur le serveur."
  question: "Pourquoi ?"
  bonne: ["Le serveur voit toutes les connexions venir de l’adresse du proxy", "L’adresse du client se trouve dans l’en-tête X-Forwarded-For ; il faut l’utiliser (en ne faisant confiance qu’au proxy) ou filtrer sur le proxy."]
  fausses:
    - ["Le proxy chiffre les adresses IP", "Le proxy ouvre une nouvelle connexion, il ne chiffre pas les adresses."]
    - ["Les clients utilisent tous IPv6", "Même en IPv6, le serveur verrait l’adresse du proxy."]
    - ["Le DNS a changé l’adresse des clients", "Le DNS ne modifie pas les adresses source des connexions."]
  retenir: "Derrière un reverse proxy : X-Forwarded-For pour l’adresse réelle du client."
  fiche: "proxy"

- niveau: "Expert"
  situation: "Un domaine fonctionne depuis le réseau interne, mais des utilisateurs de grands opérateurs obtiennent SERVFAIL depuis ce matin. Une rotation des clés DNSSEC a eu lieu hier."
  question: "Que faut-il vérifier ?"
  bonne: ["La chaîne DNSSEC : enregistrement DS chez le parent et signatures de la zone", "Les résolveurs validants rejettent les réponses dont la chaîne de confiance est cassée ; le résolveur interne ne valide peut-être pas."]
  fausses:
    - ["Le TTL de l’enregistrement A", "Un TTL n’entraîne pas de SERVFAIL."]
    - ["L’option 82 du DHCP", "Sans rapport avec la résolution de noms."]
    - ["La MTU des postes internes", "Le problème touche des résolveurs externes, pas les postes."]
  retenir: "SERVFAIL après un changement DNSSEC → chaîne de confiance (DS, RRSIG)."
  fiche: "dns-avance"

- niveau: "Expert"
  situation: "Une analyse RTP montre 0 % de perte mais une gigue qui atteint 120 ms par moments. L’utilisateur entend des coupures."
  question: "Comment l’expliquer ?"
  bonne: ["Des paquets arrivent trop tard pour le tampon de gigue et sont jetés par le téléphone", "Sans perte réseau, les retards dus aux files d’attente suffisent à créer des trous dans le son ; la QoS est la réponse."]
  fausses:
    - ["Le codec est incompatible", "Un codec incompatible empêcherait tout son, pas des coupures ponctuelles."]
    - ["Le SIP a renégocié l’appel", "Une renégociation n’explique pas une gigue de 120 ms."]
    - ["RTP utilise TCP et retransmet", "RTP fonctionne sur UDP et ne retransmet pas."]
  retenir: "En temps réel, la gigue tue autant que les pertes."
  fiche: "rtp"

- niveau: "Expert"
  situation: "On active HSTS avec includeSubDomains sur exemple.fr. Un vieux service ged.exemple.fr n’est accessible qu’en HTTP."
  question: "Quelle conséquence pour les utilisateurs ?"
  bonne: ["Les navigateurs refusent désormais d’accéder à ged.exemple.fr en HTTP, sans possibilité de contourner", "HSTS oblige le navigateur à utiliser HTTPS pour le domaine et ses sous-domaines ; le service HTTP devient inaccessible."]
  fausses:
    - ["Aucune, HSTS ne concerne que exemple.fr", "includeSubDomains étend la règle à tous les sous-domaines."]
    - ["Le site sera automatiquement converti en HTTPS", "HSTS ne configure pas le serveur ; il impose seulement le comportement du navigateur."]
    - ["Les utilisateurs verront un avertissement qu’ils pourront ignorer", "Avec HSTS, l’avertissement ne peut pas être contourné."]
  retenir: "HSTS + includeSubDomains → tous les sous-domaines doivent être en HTTPS."
  fiche: "https"

- niveau: "Expert"
  situation: "Un serveur FTP derrière un NAT répond « 227 Entering Passive Mode (10,20,0,30,195,80) » à un client situé sur Internet."
  question: "Pourquoi le téléchargement échoue-t-il ?"
  bonne: ["Le serveur annonce son adresse privée, injoignable depuis Internet", "Le client tente d’ouvrir la connexion de données vers 10.20.0.30 ; il faut annoncer l’adresse publique ou passer par une inspection FTP qui la réécrit."]
  fausses:
    - ["Le port 50 000 est réservé", "Le port de données n’est pas en cause ; l’adresse l’est."]
    - ["Le mode passif n’existe pas derrière un NAT", "Le mode passif fonctionne derrière un NAT s’il annonce la bonne adresse."]
    - ["Le client doit utiliser UDP", "FTP fonctionne en TCP."]
  retenir: "FTP écrit des adresses dans ses messages : le NAT doit être pris en compte."
  fiche: "ftp"

- niveau: "Expert"
  situation: "Dans un bâtiment, les téléphones Wi-Fi coupent les appels en passant d’un étage à l’autre, mais pas à l’intérieur d’un étage. Chaque étage utilise un VLAN différent pour le même SSID."
  question: "Quelle est la cause la plus probable ?"
  bonne: ["Le téléphone change de VLAN donc d’adresse IP en changeant d’étage, ce qui coupe l’appel", "L’itinérance doit se faire dans le même réseau IP ; sinon, la session RTP est perdue."]
  fausses:
    - ["Le codec G.711 ne supporte pas l’itinérance", "Le codec est indépendant de l’itinérance Wi-Fi."]
